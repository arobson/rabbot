name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm's OIDC trusted publishing needs npm >= 11.5.1; Node 22's bundled
      # npm predates that, so it must be upgraded explicitly before publish.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm publish --provenance
